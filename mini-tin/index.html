<main><p class="eyebrow">A LITTLE TIN. A LITTLE SECRET.</p><h1>The Mini Tin Club</h1><p>You found the mini-tin secret! Thanks for celebrating with us. We hope you pulled something good.</p><section class="pull"><h2>What did you pull?</h2><p>Show a friend your favorite card and see what they found in their tin.</p></section><footer><a href="/">Visit Friends &amp; Foils</a></footer></main>
<style>
.tin-flight{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:10;isolation:isolate}
.tin-bird{position:absolute;top:clamp(-5px,6vh,62px);left:0;width:clamp(142px,23vw,310px);height:auto;translate:-120% 0;animation:tin-cross 6.3s linear 4s both;will-change:translate}
.tin-wing{transform-box:view-box;transform-origin:140px 91px;animation:tin-flap 1.65s ease-in-out 4s 4 alternate}
.tin-far{animation-name:tin-flap-far;transform-origin:159px 80px}
@keyframes tin-cross{0%{translate:-115% 10px;rotate:-7deg}22%{translate:13vw 0;rotate:-3deg}48%{translate:43vw -17px;rotate:2deg}74%{translate:73vw 1px;rotate:0deg}100%{translate:108vw -9px;rotate:-4deg}}
@keyframes tin-flap{0%{transform:rotate(0) scaleY(1)}42%{transform:rotate(7deg) scaleY(.7)}100%{transform:rotate(21deg) scaleY(-.33)}}
@keyframes tin-flap-far{0%{transform:rotate(0) scaleY(1)}42%{transform:rotate(-4deg) scaleY(.6)}100%{transform:rotate(-17deg) scaleY(-.34)}}
.tin-glint{position:absolute;width:var(--size);aspect-ratio:1;left:var(--x);top:var(--y);color:#ffdf86;background:currentColor;opacity:0;border-radius:50%;box-shadow:0 0 5px #fff0a6;animation:tin-drift var(--life) ease-out var(--delay) both}
.tin-glint:nth-child(5n){border-radius:0;clip-path:polygon(50% 0,59% 39%,100% 50%,59% 60%,50% 100%,41% 60%,0 50%,41% 40%);background:#ffefb1}
@keyframes tin-drift{0%{opacity:0;transform:translate(0,0) scale(.55)}12%{opacity:.92}57%{opacity:.65}100%{opacity:0;transform:translate(var(--drift),var(--fall)) scale(.24)}}
@media(max-height:450px){.tin-bird{top:-5px;width:clamp(124px,20vw,200px)}}
@media(prefers-reduced-motion:reduce){.tin-flight{display:none}}
</style>

<script>
(()=>{
  const layer=document.querySelector('.tin-flight');
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const height=innerHeight,width=innerWidth;
  const narrow=height<=450;
  const tipY=narrow?43:Math.min(62,height*.06)+Math.min(70,Math.max(35,width*.051));
  let seed=41917;
  const rand=()=>((seed=(Math.imul(1664525,seed)+1013904223)>>>0)/4294967296);
  for(let i=0;i<27;i++){
    const x=(i+.5)/27;
    const t=(x*width+Math.max(85,width*.12))/(width*1.08+Math.max(160,width*.26));
    const el=document.createElement('i');
    el.className='tin-glint';
    const vars={x:(x*100)+'%',y:(tipY+rand()*18-9)+'px',delay:(4+t*6.3+.18+rand()*.2)+'s',life:(1.5+rand()*1.7)+'s',size:(i%5===4?8:2+rand()*3)+'px',drift:(rand()*23-8)+'px',fall:(32+rand()*60)+'px'};
    for(const [k,v] of Object.entries(vars))el.style.setProperty('--'+k,v);
    layer.append(el);
  }
  setTimeout(()=>layer.remove(),13700);
})();
</script>
